<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>무전 탈취 연습기</title>
  <style>
    body { background: #12131C; color: #ECEFF4; font-family: 'Pretendard', sans-serif; text-align: center; padding: 20px; margin: 0; }
    .container { max-width: 680px; margin: 0 auto; background: #1E222A; padding: 25px; border-radius: 12px; border: 1px solid #3B4252; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h1 { margin-top: 0; color: #88C0D0; font-size: 26px; }
    .status-bar { display: flex; justify-content: space-around; font-size: 18px; font-weight: bold; background: #2E3440; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    .radio-container { background: #14161D; border: 1px solid #4C566A; border-radius: 8px; padding: 12px; margin: 15px 0; text-align: left; max-height: 220px; overflow-y: auto; }
    .msg-line { font-family: monospace; font-size: 14px; color: #88C0D0; padding: 6px 0; border-bottom: 1px dashed #2E3440; }
    .msg-line:last-child { border-bottom: none; }
    .msg-delayed { color: #EBCB8B; font-weight: bold; animation: blink 1s infinite alternate; }
    @keyframes blink { from { opacity: 0.6; } to { opacity: 1; } }
    .field { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
    .zone { background: #2E3440; border: 2px dashed #4C566A; border-radius: 8px; padding: 12px; }
    .outside-zone { background: #2E3440; border: 2px dashed #D08770; border-radius: 8px; padding: 12px; margin-top: 10px; }
    .btn { background: #5E81AC; color: white; border: none; padding: 12px 28px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 5px; }
    .btn:hover { background: #81A1C1; }
    .btn:disabled { background: #4C566A; color: #D8DEE9; cursor: not-allowed; opacity: 0.6; }
    .btn-start { background: #A3BE8C; font-size: 18px; padding: 14px 36px; }
    .btn-start:hover { background: #8FBCBB; }
    .counter { display: inline-flex; align-items: center; gap: 10px; margin-top: 6px; }
    .count-btn { background: #4C566A; color: white; border: none; width: 32px; height: 32px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .count-btn:hover { background: #5E81AC; }
    .result-box { margin-top: 15px; padding: 12px; border-radius: 8px; min-height: 50px; text-align: center; }
    .success { background: rgba(163, 190, 140, 0.2); color: #A3BE8C; border: 1px solid #A3BE8C; }
    .fail { background: rgba(191, 97, 106, 0.2); color: #BF616A; border: 1px solid #BF616A; }
    .answer-desc { font-size: 15px; color: #EBCB8B; margin-top: 6px; font-weight: normal; }
  </style>
</head>
<body>
  <div class="container">
    <h1>무전 탈취 연습기</h1>
    
    <div class="status-bar">
      <div>남은 시간: <span id="timer" style="color:#EBCB8B;">30</span>초</div>
      <div>점수: <span id="score" style="color:#A3BE8C;">0</span></div>
    </div>
    
    <div class="radio-container" id="radio-box">
      <div id="empty-notice" style="text-align: center; color: #D8DEE9; padding: 40px 0;">
        [연습 시작] 버튼을 누르면 무전 수신이 시작됩니다.
      </div>
    </div>

    <div style="font-size:14px; color:#E5E9F0; margin-bottom: 5px;">인원 배치 (총 6명 배치)</div>
    
    <div class="field">
      <div class="zone">1구역 (◆) <div class="counter"><button class="count-btn" onclick="changeCount(1, -1)">-</button><span id="c1">0</span>명<button class="count-btn" onclick="changeCount(1, 1)">+</button></div></div>
      <div class="zone">2구역 (◆◆) <div class="counter"><button class="count-btn" onclick="changeCount(2, -1)">-</button><span id="c2">0</span>명<button class="count-btn" onclick="changeCount(2, 1)">+</button></div></div>
      <div class="zone">3구역 (◆◆◆) <div class="counter"><button class="count-btn" onclick="changeCount(3, -1)">-</button><span id="c3">0</span>명<button class="count-btn" onclick="changeCount(3, 1)">+</button></div></div>
      <div class="zone">4구역 (◆◆◆◆) <div class="counter"><button class="count-btn" onclick="changeCount(4, -1)">-</button><span id="c4">0</span>명<button class="count-btn" onclick="changeCount(4, 1)">+</button></div></div>
    </div>

    <div class="outside-zone">구역 바깥 (안전지대) <div class="counter"><button class="count-btn" onclick="changeCount(0, -1)">-</button><span id="c0">0</span>명<button class="count-btn" onclick="changeCount(0, 1)">+</button></div></div>

    <div id="result-container" class="result-box" style="display:none;">
      <div id="result-msg" style="font-size: 18px; font-weight: bold;"></div>
      <div id="answer-desc" class="answer-desc"></div>
    </div>

    <div style="margin-top: 15px;">
      <button id="start-btn" class="btn btn-start" onclick="startNewRound()">연습 시작</button>
      <button id="submit-btn" class="btn" onclick="submitAnswer()" style="display:none;" disabled>제출 대기 중 (12초)...</button>
    </div>
  </div>

  <script>
    let counts = [0, 0, 0, 0, 0];
    let currentProblem = {};
    let score = 0, timer = 30, interval = null, delayTimeout = null, waitInterval = null;
    let isPlaying = false;
    let canSubmit = false;
    let waitTimer = 12;

    const fakeText = "안..대로.. 회..하라..";

    function getRandomZone(exceptZone = 0) {
      let z;
      do {
        z = Math.floor(Math.random() * 4) + 1;
      } while (z === exceptZone);
      return z;
    }

    function generateProblem() {
      const type = Math.floor(Math.random() * 6) + 1;
      let initialMsgs = [], delayedMsgs = [], checkFn = null, answerText = "";

      if (type === 1) { // #1 n구역 n명, n구역 n명
        const z1 = getRandomZone();
        const z2 = getRandomZone(z1);
        initialMsgs = [`...${z1}..역...에서 4명...`, `...${z2}..역...에서 2명...`].sort(() => Math.random() - 0.5);
        checkFn = (c) => c[z1] === 4 && c[z2] === 2 && c.reduce((a,b)=>a+b,0) === 6;
        answerText = `정답: ${z1}구역에 4명, ${z2}구역에 2명 배치`;
      } 
      else if (type === 2) { // #2 n구역 제외 포격 실시
        const z = getRandomZone();
        initialMsgs = ["..전...구역 포... 실시..", `...${z}..역..`, "제..하고.."];
        checkFn = (c) => c[z] === 6;
        answerText = `정답: ${z}구역 제외 포격이므로 ${z}구역에 6명 전원 배치`;
      } 
      else if (type === 3) { // #3 n구역만 포격 실시 (탈..하라..)
        const z = getRandomZone();
        initialMsgs = ["...포.. 실시..", `...${z}..역...`, "탈..하라.."];
        checkFn = (c) => c[z] === 0 && c.reduce((a,b)=>a+b,0) === 6;
        answerText = `정답: ${z}구역 집중 포격이므로 ${z}구역을 제외한 구역/바깥에 6명 배치`;
      } 
      else if (type === 4) { // #4 안전지대 변경 (10초 뒤 수신)
        const z1 = getRandomZone();
        const z2 = getRandomZone(z1);
        initialMsgs = ["..전...구역 포... 실시..", `...${z1}..역..`, "제..하고.."];
        delayedMsgs = ["..안...대가.. 변...되다", `...${z2}..역..으로 회..하라...`].sort(() => Math.random() - 0.5);
        
        checkFn = (c) => c[z2] === 6;
        answerText = `정답: ${z2}구역으로 안전지대가 변경되었으므로 ${z2}구역에 6명 전원 배치`;
      } 
      else if (type === 5) { // #5 안전지대 연산 기믹 (10초 뒤 수신)
        const baseZ = getRandomZone();
        const isPlus = Math.random() < 0.5;
        const op = isPlus ? '+' : '-';
        const num = Math.floor(Math.random() * 2) + 1;

        let leaveZ = isPlus ? baseZ + num : baseZ - num;
        if (leaveZ > 4) leaveZ -= 4;
        if (leaveZ < 1) leaveZ += 4;
        
        initialMsgs = ["..전...구역 포... 실시..", `...${baseZ}..역..`, "제..하고.."];
        delayedMsgs = [op, `...${num}..역`, "제..하라.."];
        
        checkFn = (c) => c[leaveZ] === 0 && c.reduce((a,b)=>a+b,0) === 6;
        answerText = `정답: 기본 ${baseZ}구역 안전 중 -> ${leaveZ}구역 이탈 (${leaveZ}구역 제외한 곳에 6명 배치)`;
      } 
      else if (type === 6) { // #6 전구역 이탈 (탈..하라..)
        initialMsgs = ["..전...구역 포... 실시..", "탈..하라.."];
        checkFn = (c) => c[0] === 6;
        answerText = "정답: 전구역 이탈 (구역 바깥에 6명 전원 배치)";
      }

      // '탈..하라..' 문구가 없는 문제일 때만 확률적(50%)으로 페이크 무전 추가
      const hasTalHara = initialMsgs.includes("탈..하라..");
      if (!hasTalHara && Math.random() < 0.5) {
        initialMsgs.push(fakeText);
      }

      return { initialMsgs, delayedMsgs, checkFn, answerText };
    }

    function appendRadioMessage(text, isDelayed = false) {
      const radioBox = document.getElementById('radio-box');
      const emptyNotice = document.getElementById('empty-notice');
      if (emptyNotice) emptyNotice.remove();

      const msgDiv = document.createElement('div');
      msgDiv.className = `msg-line ${isDelayed ? 'msg-delayed' : ''}`;
      msgDiv.innerText = `탈취한 무전 신호 : ${text}`;
      radioBox.appendChild(msgDiv);

      radioBox.scrollTop = radioBox.scrollHeight;
    }

    function startNewRound() {
      isPlaying = true;
      canSubmit = false;
      counts = [0, 0, 0, 0, 0];
      updateCountDisplay();
      
      document.getElementById('result-container').style.display = 'none';
      document.getElementById('start-btn').style.display = 'none';
      
      const radioBox = document.getElementById('radio-box');
      radioBox.innerHTML = '';

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.style.display = 'inline-block';
      submitBtn.disabled = true;
      
      waitTimer = 12;
      submitBtn.innerText = `제출 대기 중 (${waitTimer}초)...`;

      currentProblem = generateProblem();

      currentProblem.initialMsgs.forEach(msg => {
        appendRadioMessage(msg, false);
      });

      clearTimeout(delayTimeout);
      clearInterval(interval);
      clearInterval(waitInterval);

      waitInterval = setInterval(() => {
        waitTimer--;
        if (waitTimer > 0) {
          submitBtn.innerText = `제출 대기 중 (${waitTimer}초)...`;
        } else {
          clearInterval(waitInterval);
          canSubmit = true;
          submitBtn.disabled = false;
          submitBtn.innerText = '제출 (Space)';
        }
      }, 1000);

      if (currentProblem.delayedMsgs.length > 0) {
        delayTimeout = setTimeout(() => {
          if (!isPlaying) return;
          currentProblem.delayedMsgs.forEach(msg => {
            appendRadioMessage(msg, true);
          });
        }, 10000);
      }

      timer = 30;
      document.getElementById('timer').innerText = timer;
      interval = setInterval(() => {
        timer--;
        document.getElementById('timer').innerText = timer;
        if (timer <= 0) {
          clearInterval(interval);
          clearTimeout(delayTimeout);
          clearInterval(waitInterval);
          finishRound(false, '시간 초과!');
        }
      }, 1000);
    }

    function changeCount(zone, val) {
      if (!isPlaying) return;
      const total = counts.reduce((a, b) => a + b, 0);
      if (val > 0 && total >= 6) return;
      if (counts[zone] + val < 0) return;
      counts[zone] += val;
      updateCountDisplay();
    }

    function updateCountDisplay() {
      for (let i = 0; i <= 4; i++) {
        document.getElementById(`c${i}`).innerText = counts[i];
      }
    }

    function submitAnswer() {
      if (!isPlaying || !canSubmit) return;
      const total = counts.reduce((a, b) => a + b, 0);
      if (total < 6) {
        alert('6명을 모두 배치해야 합니다!');
        return;
      }

      clearInterval(interval);
      clearTimeout(delayTimeout);
      clearInterval(waitInterval);

      if (currentProblem.checkFn(counts)) {
        score += 100;
        document.getElementById('score').innerText = score;
        finishRound(true, '성공!');
      } else {
        finishRound(false, '오답입니다!');
      }
    }

    function finishRound(isSuccess, msg) {
      isPlaying = false;
      canSubmit = false;
      const container = document.getElementById('result-container');
      const msgElem = document.getElementById('result-msg');
      const descElem = document.getElementById('answer-desc');

      container.style.display = 'block';
      msgElem.innerText = msg;

      if (isSuccess) {
        container.className = 'result-box success';
        descElem.innerText = '';
      } else {
        container.className = 'result-box fail';
        descElem.innerText = currentProblem.answerText;
      }

      document.getElementById('start-btn').innerText = '다음 문제 시작';
      document.getElementById('start-btn').style.display = 'inline-block';
      document.getElementById('submit-btn').style.display = 'none';
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (isPlaying && canSubmit) {
          submitAnswer();
        } else if (!isPlaying) {
          startNewRound();
        }
      }
    });
  </script>
</body>
</html>
